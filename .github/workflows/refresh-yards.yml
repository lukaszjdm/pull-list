

name: Refresh partial LKQ inventory snapshot

on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths:
      - "sync_yards.py"
      - "summit_official.py"
      - ".github/workflows/refresh-yards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-list-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: pip install -r requirements.txt

      - name: Refresh official LKQ public pages
        run: python sync_yards.py

      - name: Commit changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add yard-inventory.json yard-inventory.js

          if git diff --cached --quiet; then
            echo "No inventory changes."
            exit 0
          fi

          git commit -m "Update public LKQ yard snapshot"

          git pull --rebase origin main
          git push origin HEAD:main
