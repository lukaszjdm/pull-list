name: Refresh partial LKQ inventory snapshot
on:
  schedule:
    - cron: "0 8,10,12,14,16,18 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:


permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install -r requirements.txt
      - name: Refresh official LKQ public pages
        run: python sync_yards.py
      - name: Commit changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yard-inventory.json yard-inventory.js
          git diff --cached --quiet || (git commit -m "Update public LKQ yard snapshot" && git push)
